name: Build Manual (reusable)

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""
      release_tag:
        description: If set, the manual is uploaded as an asset to this release tag.
        required: false
        type: string
        default: ""

jobs:
  manual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.72.2
          environments: manual
          cache: true

      - name: Build manual
        run: pixi run manual
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload manual
        uses: actions/upload-artifact@v4
        with:
          name: melon-manual-${{ github.sha }}
          path: manual/build/melon-manual.pdf
          if-no-files-found: error

      - name: Attach manual to release
        if: inputs.release_tag != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" \
            manual/build/melon-manual.pdf --clobber
